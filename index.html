<!DOCTYPE html>
<html lang="it">
<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>I Miei Viaggi</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link rel="stylesheet" href="style.css">

</head>

<body>

	<div id="header">

		<h1>✈️ I Miei Viaggi</h1>

		<div id="menu">

			<button class="btn btn-success" onclick="mostraSpesi()">
				💰 Spesi
			</button>

			<button class="btn btn-warning" onclick="mostraVoli()">
				🛫 Voli
			</button>

			<button class="btn btn-primary" onclick="salvaDati()">
				💾 Salva
			</button>

			<button class="btn btn-danger" onclick="eliminaTutto()">
				🗑️ Elimina
			</button>

		</div>

	</div>

	<div class="container">

		<div class="box">

			<h2>➕ Aggiungi Viaggio</h2>

			<input type="text" id="citta" class="form-control" placeholder="Città">

			<input type="date" id="data" class="form-control">

			<input type="number" id="soldi" class="form-control" placeholder="Soldi spesi">

			<div id="check">

				<label>Hai usato l'aereo?</label>

				<br>

				<input type="checkbox" id="aereo">

			</div>

			<button class="btn btn-primary mt-3" onclick="aggiungiViaggio()">
				Aggiungi
			</button>

		</div>

		<div class="box">

			<h2>🗺️ Lista Viaggi</h2>

			<p id="numeroViaggi">
				Numero viaggi: 0
			</p>

			<div class="table-responsive">

				<table class="table table-bordered table-striped">

					<thead>

						<tr>

							<th>Città</th>

							<th>Data</th>

							<th>Aereo</th>

							<th>Soldi</th>

							<th>X</th>

						</tr>

					</thead>

					<tbody id="tabella"></tbody>

				</table>

			</div>

		</div>

		<div class="box">

			<h2>🤖 Suggerimenti AI</h2>

			<button class="btn btn-primary" onclick="ai()">
				Dammi Idee
			</button>

			<div id="risultatiAI"></div>

		</div>

	</div>

	<div class="modal fade" id="modalInfo">

		<div class="modal-dialog">

			<div class="modal-content">

				<div class="modal-header">

					<h5 class="modal-title">
						Informazioni
					</h5>

					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>

				</div>

				<div class="modal-body" id="testoModal"></div>

			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<script src="script.js"></script>

</body>
</html>
